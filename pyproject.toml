[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# The DISTRIBUTION is `certo-math`; the import package and the commands stay
# `certo`. Renaming the package would break every spec ever written, every
# `.mcp.json`, and the provenance in every certificate already issued -- and
# "certo" alone is a crowded word in search. You type the distribution once.
name = "certo-math"
# ONE source of truth. This used to be written here AND in `__init__.py`, and
# a release had to edit both -- so they drifted, and the installed metadata
# reported 0.6.0 while the CLI reported 0.9.0. A user noticed before we did.
dynamic = ["version"]
description = "Certificates for the work before the proof: decide, enumerate, optimise, reduce and certify -- and re-check it all without trusting the tool. CLI + MCP."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Juan Pablo Traverso"}]
keywords = ["proof", "certificate", "smt", "z3", "linear-programming",
            "combinatorics", "lean", "mcp", "formalisation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = ["z3-solver>=4.12", "pulp>=2.7"]

[project.urls]
Homepage = "https://jtraverso.github.io/certo-math/"
Repository = "https://github.com/jtraverso/certo-math"
Changelog = "https://github.com/jtraverso/certo-math/blob/main/CHANGELOG.md"
Documentation = "https://github.com/jtraverso/certo-math/blob/main/docs/COMMANDS.md"

[project.optional-dependencies]
mcp = ["mcp>=2.0"]
# Rigorous numerics for `bounds`, and the Gram-matrix search behind `sos`.
# mpmath is the pure-Python interval fallback; python-flint (Arb) is faster and
# has the special functions, so it is preferred when installed. numpy is not
# optional within this extra: `sos` searches for the Gram matrix by
# eigendecomposition, and without it there is nothing to search with.
# clarabel is the interior-point SDP solve behind `sos`: measured at 26 of 30
# random sums of squares certified against 6 for the alternating projections
# it falls back to, which remain the path when it is absent.
# highspy is HiGHS in-process, for every continuous solve behind `opt`: 1.3 ms
# against CBC's 258 on the same LPs, almost all of that CBC starting as a
# subprocess. It needs numpy, which is why it is here and not beside pulp.
numerics = ["python-flint>=0.6", "mpmath>=1.3", "numpy>=1.24", "clarabel>=0.9",
            "highspy>=1.7"]
# The facets of a cone, exactly, for `semigroup`: they decide pointedness,
# cone membership and the separator where the fallback searches subsets of
# generators (a grading for 77 of 140 pointed cones, against 140). Its own
# extra and not part of `numerics`, because pycddlib ships wheels only for
# Windows: on Linux and macOS it builds against cddlib and GMP, which pip
# cannot install, and `numerics` must not stop installing where it works.
polyhedra = ["pycddlib>=3.0"]

[project.scripts]
certo = "certo.cli:main"
certo-mcp = "certo.mcp_server:main"

[tool.setuptools.dynamic]
version = {attr = "certo.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
certo = ["locales/*.json"]
