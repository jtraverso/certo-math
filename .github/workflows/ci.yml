name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Everything has only ever been run on one Windows machine, and the three most
# useful bugs of the last round were all specific to it: a truncated Mathlib
# artefact, subprocess output decoded with the Windows codepage, and an import
# that did not bring the instances it needed. A Linux runner finds a different
# family.
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          - {os: macos-latest, python: "3.11"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[mcp,numerics]"
      # pycddlib: wheels only for Windows; elsewhere it builds against cddlib
      # and GMP. Tried everywhere, and a failure is a warning, not a red job:
      # `semigroup` has a fallback, and the `nocdd` tests exercise it anyway.
      # nauty, so the test that compares filters pushed into geng with the
      # Python route runs against a real geng. Debian names it nauty-geng.
      - name: nauty (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y nauty || true
      - name: pycddlib (optional)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y libcdd-dev libgmp-dev || true; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install cddlib gmp || true; fi
          pip install "pycddlib>=3.0" || echo "::warning::pycddlib did not install; semigroup ran on its fallback"
      - name: capabilities
        run: certo doctor
      # `determinism` was the one cross-cutting rule CI did not check, which
      # is the shape of promise that quietly stops being true. It is rule
      # three: the budget is work, not wall clock.
      - name: tests
        shell: bash
        run: |
          for t in smoke mcp i18n extras adversarial determinism; do
            python tests/test_$t.py
          done

  # The install with no extras at all: z3 and pulp, nothing else. It is a
  # supported configuration -- `doctor` says which capabilities are missing
  # and what each gap costs -- and it is the one nobody exercises by accident.
  #
  # It does NOT run the full suite. Most of `extras` needs an interval backend
  # or numpy, and an earlier attempt to run it here failed dozens of tests
  # that were right to assume what the extras provide. What this job claims is
  # narrower and true: the CLI starts, reports the gaps honestly, and the
  # solver-free commands work.
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: it starts, and says what is missing
        run: |
          certo --version
          certo doctor
          certo commands --table
      - name: the commands that need nothing extra still work
        run: |
          certo prove examples/refute_density.py
          certo matrix examples/integer_matrix.py
          certo cone examples/toric_cone.py
          certo range examples/variable_range.py --var a
          certo cycle examples/dependency_cycle.py
          certo opt examples/lp_as_data.json
      - name: and the ones that need an extra say so rather than crashing
        shell: bash
        run: |
          set -e
          out=$(certo bounds examples/bounds_constant.py 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "python-flint" || {
            echo "::error::bounds did not name the missing backend"; exit 1; }

  # The examples are the documentation, and documentation that no longer runs
  # is worse than none. Each one is executed exactly as the README shows it.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[mcp,numerics]"
      # pycddlib: wheels only for Windows; elsewhere it builds against cddlib
      # and GMP. Tried everywhere, and a failure is a warning, not a red job:
      # `semigroup` has a fallback, and the `nocdd` tests exercise it anyway.
      # nauty, so the test that compares filters pushed into geng with the
      # Python route runs against a real geng. Debian names it nauty-geng.
      - name: nauty (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y nauty || true
      - name: pycddlib (optional)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y libcdd-dev libgmp-dev || true; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install cddlib gmp || true; fi
          pip install "pycddlib>=3.0" || echo "::warning::pycddlib did not install; semigroup ran on its fallback"
      - name: run every example and verify its certificate
        shell: bash
        run: python tests/run_examples.py

  # `certo export --lean` claims its output compiles. That claim is the one
  # most likely to be wrong -- it took three rounds against a real compiler to
  # get right -- and it is the one nobody should take on trust from a text
  # generator.
  lean:
    runs-on: ubuntu-latest
    continue-on-error: true      # Mathlib's cache is not ours to depend on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[numerics]"
      # `lean-action` refuses to run without a `lake-manifest.json`, which is
      # why this job had never once passed. The manifest is committed rather
      # than generated here: it pins Mathlib AND its transitive dependencies
      # to exact revisions, so "compiles against Mathlib v4.28.0" means the
      # same thing in six months as it does today. `lakefile.toml` pins only
      # the one `rev`; the manifest pins the graph under it.
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: .github/lean
          build: false
      # ONE route, because 0.9.0 left one on purpose: a linear Farkas
      # certificate, where `linarith` decides the fragment the goal lives in.
      # This job kept exporting four kinds long after three of them began
      # refusing, so it failed every run and stopped being read -- a red tick
      # nobody acts on is worse than no tick.
      #
      # That the other three REFUSE is a claim about certo, not about
      # Mathlib's cache, so it lives in the test suite where it runs on every
      # platform instead of in the one job allowed to fail.
      - name: emit and compile the route that decides its fragment
        shell: bash
        run: |
          set -e
          mkdir -p out
          certo farkas examples/farkas_linear.py --cert out/fk.json
          certo export out/fk.json --lean \
            --out .github/lean/CertoEmitted.lean \
            --lean-project .github/lean --check
