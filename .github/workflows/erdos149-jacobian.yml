name: Erdos149 Certo + Jacobian research

on:
  push:
    branches:
      - research/erdos149-arco3-cegis-s594
    paths:
      - 'research/erdos149/**'
      - '.github/workflows/erdos149-jacobian.yml'
      - 'examples/erdos149_arco3_palette_path.json'
  workflow_dispatch:

jobs:
  independent-exact-lp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Jacobian and Certo from explicit mathematical packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'jacobian==0.23.0' -e '.[numerics]'
      - name: Discover Jacobian exact mathematical contract
        run: jacobian inspect optimization.linear.rational_general_optimum.compute
      - name: Certo primal/dual exact certificate
        run: |
          mkdir -p out
          certo lint examples/erdos149_arco3_cegis_degree.py
          certo opt examples/erdos149_arco3_palette_path.json --cert out/erdos149_path_certo.json
          certo verify out/erdos149_path_certo.json
      - name: Certo exact synthesis and scalar gate certificates
        run: |
          mkdir -p out
          certo synth examples/erdos149_arco3_cegis_degree.py --prove-candidate --cert out/arco3_degree_cegis.json
          certo verify out/arco3_degree_cegis.json
          certo prove examples/erdos149_arco3_degree4_counterexample.py --cert out/arco3_degree4_refuted.json
          certo verify out/arco3_degree4_refuted.json
          for f in examples/erdos149_arco3_degree{4,5}_heavy_diagonal.py \
                   examples/erdos149_arco3_degree4_heavy_{vertex,slope}.py \
                   examples/erdos149_arco3_heavy_saturation.py \
                   examples/erdos149_arco3_no_light_cut.py; do
            certo prove "$f" --cert "out/$(basename "$f" .py).json"
            certo verify "out/$(basename "$f" .py).json"
          done
      - name: Certo connected graph exact palette LP
        run: |
          certo opt examples/erdos149_arco3_palette_connected_c5.json --cert out/arco3_connected_c5.json
          certo verify out/arco3_connected_c5.json
      - name: S595 physical 617-vertex graph audits
        run: python tests/test_erdos149_s595.py
      - name: C11 simultaneous blocker exact tests
        run: python research/erdos149/test_s596_c11.py
      - name: Jacobian independent exact physical-LP solve
        run: python research/erdos149/verify_with_jacobian.py
      - name: Jacobian C11 physical induced-matching relaxation
        run: python research/erdos149/c11_jacobian_relaxation.py
      - name: S597 universal root-pair Hall algebra
        run: |
          certo prove examples/erdos149_s597_root_hall_scalar.py --cert out/s597_root_hall.json
          certo verify out/s597_root_hall.json
      - name: S597 replay 23-node and 18-node exact global palettes
        run: python research/erdos149/s597_verify_static_palettes.py
      - name: S597 Certo heavy-cycle mass shielding
        run: |
          certo prove examples/erdos149_s597_cycle_shielding.py --cert out/s597_cycle_shielding.json
          certo verify out/s597_cycle_shielding.json
      - name: S597 Certo universal parametric absorber inequality
        run: |
          certo prove examples/erdos149_s597_twoscale_budget.py --cert out/s597_twoscale_budget.json
          certo verify out/s597_twoscale_budget.json
      - name: S597 weighted core exact replay and near-tight 3-connected adversary
        run: python research/erdos149/test_s597_weighted_core.py
      - name: S598 true-twin and false-twin exact quotient replay
        run: |
          python research/erdos149/test_s598_conflict_twins.py
          python research/erdos149/test_s598_false_twins.py
      - name: S598 Certo dual-negative localization inequality
        run: |
          certo lint examples/erdos149_s598_dual_negative.py
          certo prove examples/erdos149_s598_dual_negative.py --cert out/s598_dual_negative.json
          certo verify out/s598_dual_negative.json
      - name: Bundle audit summary
        if: always()
        run: |
          mkdir -p out
          python - <<'PY'
          import json
          from pathlib import Path
          Path("out/STATUS.json").write_text(json.dumps({
            "conjecture":"Erdos-Nesetril #149",
            "scope":"finite 7-edge path palette LP only",
            "universal_gate":"OPEN",
            "status":"see CI steps, do not infer result from workflow completion"
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erdos149-certo-jacobian
          path: out/
