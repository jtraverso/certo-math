name: publish

# Tag-only, and its own file rather than a step inside `ci.yml`.
#
# Trusted Publishing mints a PyPI credential for whichever workflow PyPI is
# configured to trust. `ci.yml` runs on every push and every pull request, so
# trusting it would mean any one of those runs could publish. This one runs on
# a tag and nothing else, which is the whole reason it exists separately.
#
# Configure the publisher at https://pypi.org/manage/account/publishing/ with
# workflow `publish.yml` and environment `pypi` -- not `(Any)`. A named
# environment is what lets Settings -> Environments require a human click
# before a tag can reach the index.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # A tag is a number somebody typed. The version is a number in the code.
  # This project's whole argument is that two numbers nobody compares drift --
  # it has already shipped a README saying twenty-eight over a list of
  # twenty-nine, and metadata reporting 0.6.0 while the tool said 0.9.0. A
  # release is the worst place for that, because the wrong number is permanent:
  # PyPI does not let a version be replaced.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag is the version
        shell: bash
        run: |
          set -e
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "manual run: no tag to compare against"
            grep -q "^## \[" CHANGELOG.md && exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          CODE=$(python -c "import sys; sys.path.insert(0,'src'); import certo; print(certo.__version__)")
          echo "tag: $TAG   code: $CODE"
          if [ "$TAG" != "$CODE" ]; then
            echo "::error::the tag says $TAG and certo.__version__ says $CODE"
            exit 1
          fi
          grep -q "^## \[$CODE\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no entry for $CODE"
            exit 1
          }

  # The artefact that ships is the artefact that was tested. Depending on a
  # green run of `ci.yml` would test a commit; this tests the tag.
  # THE ARTEFACT THAT SHIPS IS THE ARTEFACT THAT WAS TESTED -- on every
  # interpreter that claims to be supported, not on one of them.
  #
  # This job used to run ubuntu/3.12 alone, while `ci.yml` ran the matrix.
  # Two suites nobody compares drift, which is the same argument the `guard`
  # job below is built on, one level up: 0.15.0 and 0.15.1 both reached the
  # index green while `tests` was RED on 3.11, because publishing never
  # looked. The matrix is the same one `ci.yml` uses, and a release now waits
  # for all of it.
  tests:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        exclude:
          - {os: macos-latest, python: "3.11"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[mcp,numerics]"
      # pycddlib: wheels only for Windows; elsewhere it builds against cddlib
      # and GMP. Tried everywhere, and a failure is a warning, not a red job:
      # `semigroup` has a fallback, and the `nocdd` tests exercise it anyway.
      # nauty, so the test that compares filters pushed into geng with the
      # Python route runs against a real geng. Debian names it nauty-geng.
      - name: nauty (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y nauty || true
      - name: pycddlib (optional)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y libcdd-dev libgmp-dev || true; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install cddlib gmp || true; fi
          pip install "pycddlib>=3.0" || echo "::warning::pycddlib did not install; semigroup ran on its fallback"
      - name: tests
        shell: bash
        run: |
          for t in smoke mcp i18n extras adversarial determinism; do
            python tests/test_$t.py
          done
      - name: every example, and its certificate
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tests/run_examples.py

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: the metadata PyPI will render
        run: python -m twine check dist/*
      # Installed from the wheel, in a clean environment, before anything is
      # published: an sdist that builds and a wheel that runs are different
      # claims, and only one of them is what a user gets.
      - name: the wheel actually works
        shell: bash
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/certo --version
          /tmp/fresh/bin/certo commands --table | head -3
          /tmp/fresh/bin/python -c "import certo; print(certo.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # The only job with the token permission, and the only one bound to the
    # environment. Least privilege is not ceremony here: this is the step that
    # can write to a public index and cannot be undone.
    environment:
      name: pypi
      url: https://pypi.org/p/certo-math
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # PUBLISHING IS NOT THE WHOLE OF SHIPPING, and treating it as such left ten
  # tags with no GitHub Release -- every version from 0.11.1 to 0.13.0 reached
  # the index while the repository's own front door still advertised 0.11.0.
  # Nothing was broken; a step nobody had written simply never ran.
  #
  # It runs AFTER `publish`, deliberately. A release note announcing a version
  # that failed to reach the index would be the same class of lie this project
  # exists to refuse -- a document saying something the world does not confirm.
  release:
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: the section of the CHANGELOG this tag is about
        id: notes
        shell: bash
        run: |
          set -e
          V="${GITHUB_REF_NAME#v}"
          # From `## [V]` to the next `## [`, exclusive.
          #
          # NO REGEX ON PURPOSE. The first version of this used one, and the
          # backslashes did not survive the trip through YAML and the shell:
          # awk read the bracket escape as a character class and matched
          # nothing, so every release note would have shipped empty. A prefix
          # test with `index` has nothing to escape, and this one was checked
          # against three real sections before being written here.
          awk -v hdr="## [$V]" \
            'index($0,hdr)==1 {on=1; next}
             on && index($0,"## [")==1 {exit}
             on {print}' CHANGELOG.md > notes.md
          # The guard job has already refused the tag when the section is
          # absent, so nothing here is a missing entry -- an empty extraction
          # is a bug in THIS step, and it fails loudly rather than publishing
          # a blank release note.
          if [ -z "$(sed '/^[[:space:]]*$/d' notes.md)" ]; then
            echo "::error::extracted no notes for $V after the guard passed"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: create it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.notes.outputs.version }}" \
            --notes-file notes.md \
            --verify-tag
